<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровой глитч #4 (Отражённый)</title>
    <style>
        body {
            background-color: #050505;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 4px;
            color: #777;
            margin-bottom: 20px;
            font-size: 1.6rem;
            text-transform: uppercase;
        }
        canvas {
            border-radius: 18px;
            background: #040404;
            filter: blur(0.7px);
            display: block;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            width: 512px;
            height: 512px;
            margin: 0 auto;
            /* 🌀 ОТРАЖЕНИЕ ВПРАВО И ВНИЗ (зеркально по осям X и Y) */
            transform: scale(-1, -1); 
        }
        @media (max-width: 600px) {
            canvas { width: 100%; height: auto; aspect-ratio: 1/1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✦ Цифровой Глитч #4</h1>
        <canvas id="glitchCanvas" width="512" height="512"></canvas>
    </div>

    <script>
        // ==========================================================
        // 1. Единая Палитра LUT
        // ==========================================================
        const stops = [
            [0.00, 250, 0.85, 1], [0.12, 265, 0.8, 1], [0.25, 290, 0.75, 1],
            [0.38, 330, 0.7, 1], [0.50, 5, 0.8, 1], [0.62, 30, 0.85, 1],
            [0.75, 160, 0.75, 1], [0.88, 195, 0.8, 1], [1.00, 225, 0.85, 1]
        ];

        function hsv2rgb(h, s, v) {
            h = h % 360.0;
            const c = v * s, x = c * (1 - Math.abs((h / 60.0) % 2 - 1)), m = v - c;
            let r, g, b;
            if (h < 60) { r = c; g = x; b = 0; }
            else if (h < 120) { r = x; g = c; b = 0; }
            else if (h < 180) { r = 0; g = c; b = x; }
            else if (h < 240) { r = 0; g = x; b = c; }
            else if (h < 300) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }
            return [r + m, g + m, b + m];
        }

        function getPaletteColor(t, shift = 0) {
            t = ((t + shift) % 1 + 1) % 1;
            for (let j = 0; j < stops.length - 1; j++) {
                if (stops[j][0] <= t && t <= stops[j+1][0]) {
                    const p0 = stops[j][0], p1 = stops[j+1][0], f = (t - p0) / (p1 - p0);
                    let h1 = stops[j][1], h2 = stops[j+1][1];
                    const d = h2 - h1;
                    if (d > 180) h1 += 360; else if (d < -180) h2 += 360;
                    const h = h1 + (h2 - h1) * f;
                    const s = stops[j][2] + (stops[j+1][2] - stops[j][2]) * f;
                    const v = stops[j][3] + (stops[j+1][3] - stops[j][3]) * f;
                    return hsv2rgb(h, s, v);
                }
            }
            return hsv2rgb(stops[stops.length-1][1], stops[stops.length-1][2], stops[stops.length-1][3]);
        }

        const LUT_SIZE = 1024;
        const LUT = Array.from({ length: LUT_SIZE }, (_, i) => getPaletteColor(i / (LUT_SIZE - 1)));

        // ==========================================================
        // 2. RNG
        // ==========================================================
        function mulberry32(a) {
            return () => {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        function normalRandom(rand) {
            let u1, u2;
            do { u1 = rand(); } while (u1 === 0);
            do { u2 = rand(); } while (u2 === 0);
            return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
        }

        // ==========================================================
        // 3. Паттерн: Цифровой глитч (с новым поворотом)
        // ==========================================================
        function drawDigitalGlitch(buf, SIZE, CX, CY, core, maxR, LUT, config) {
            const rand = mulberry32(config.seed);
            const phaseShift = 0.6; 
            
            for (let i = 0; i < config.count; i++) {
                const u = rand() ** 0.4;
                const r = core + u * (maxR - core);
                if (!isFinite(r)) continue;

                const angle = Math.PI * 2 * rand() + (Math.floor(rand() * config.arms) / config.arms) * 0.45 + phaseShift;
                const r_mod = Math.max(core, r + normalRandom(rand) * config.thickness * 2.5);
                if (!isFinite(angle) || !isFinite(r_mod)) continue;

                const colIdx = Math.floor((((angle / (2 * Math.PI) + config.hueShift) % 1) * (LUT_SIZE - 1)));
                const col = LUT[colIdx];
                const alpha = (0.3 + (1 - u) * 0.7) * (0.6 + 0.4 * Math.sin(angle * 20 + r * 0.5));
                const [rC, gC, bC] = col.map(c => c * alpha * 255);

                let xi = Math.round(CX + Math.cos(angle) * r_mod);
                let yi = Math.round(CY + Math.sin(angle) * r_mod);
                if (!isFinite(xi) || xi < 0 || xi >= SIZE || yi < 0 || yi >= SIZE) continue;
                for (let dx = -1; dx <= 1; dx++) {
                    const xx = Math.min(SIZE - 1, Math.max(0, xi + dx));
                    for (let dy = -1; dy <= 1; dy++) {
                        const yy = Math.min(SIZE - 1, Math.max(0, yi + dy));
                        const idx = (yy * SIZE + xx) * 3;
                        buf[idx] += rC * 0.33; buf[idx+1] += gC * 0.33; buf[idx+2] += bC * 0.33;
                    }
                }
            }
        }

        // ==========================================================
        // 4. Финальный рендерер (Черная дыра без кольца)
        // ==========================================================
        function renderLogo() {
            const canvas = document.getElementById('glitchCanvas');
            const ctx = canvas.getContext('2d');
            const SIZE = 512;
            const CX = SIZE/2, CY = SIZE/2;
            const core = SIZE * 0.045, maxR = SIZE * 0.44;
            const holeRadius = core * 0.75;
            
            const buf = new Float32Array(SIZE * SIZE * 3);

            const config = {
                type: 'glitch',
                arms: 7,
                spin: 4.0,
                thickness: 0.12,
                seed: 2468,
                count: 120000,
                hueShift: 0.35,
                glowHue: 140
            };

            drawDigitalGlitch(buf, SIZE, CX, CY, core, maxR, LUT, config);

            const imageData = ctx.createImageData(SIZE, SIZE);
            const data = imageData.data;

            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    const dist = Math.sqrt((y - CY)**2 + (x - CX)**2);
                    const fade = Math.min(1, Math.max(0, 1 - (dist - maxR * 0.7) / (maxR * 0.5)));

                    let rVal = buf[(y * SIZE + x) * 3] * fade;
                    let gVal = buf[(y * SIZE + x) * 3 + 1] * fade;
                    let bVal = buf[(y * SIZE + x) * 3 + 2] * fade;

                    rVal = 255 * (1 - Math.exp(-rVal / 255 * 1.5));
                    gVal = 255 * (1 - Math.exp(-gVal / 255 * 1.5));
                    bVal = 255 * (1 - Math.exp(-bVal / 255 * 1.5));

                    const mask = dist > holeRadius ? 1.0 : 0.0;
                    const idx = (y * SIZE + x) * 4;
                    data[idx] = Math.min(255, Math.max(0, Math.round(rVal * mask)));
                    data[idx+1] = Math.min(255, Math.max(0, Math.round(gVal * mask)));
                    data[idx+2] = Math.min(255, Math.max(0, Math.round(bVal * mask)));
                    data[idx+3] = 255;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        renderLogo();
    </script>
</body>
</html>
